spring.application.name=field-notes-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Supabase PostgreSQL Connection
# Either provide SPRING_DATASOURCE_URL directly or configure the individual SUPABASE_DB_* properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations for Supabase PostgreSQL
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Supabase Auth / OAuth2 Resource Server
# Supabase JWKS URL format: https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

upload.dir=uploads
